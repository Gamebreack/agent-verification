name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate skill and behavioral fixtures
        run: python3 scripts/eval_harness.py validate
      - name: Run harness tests
        run: python3 -m unittest discover -s tests -v
